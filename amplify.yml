version: 1
backend:
  phases:
    build:
      commands:
        # npm ci refuses this tree: nested aws-cdk-lib/@aws-amplify packages pin
        # transitive deps (e.g. @opentelemetry/core) in a way npm's own installer
        # resolves fine but npm ci's strict lockfile check rejects. Reproduces
        # locally, unrelated to this build environment.
        - npm install --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm install --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
